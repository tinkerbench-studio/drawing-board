# Tests every pull request and push to main. A push to main that raises the version in package.json tags it, cuts a GitHub release and
# publishes the package to GitHub Packages (the release job); a v* tag pushed by hand publishes through the publish job, after checking the
# tag is the version in package.json. The marketplace pins this repository by that tag, so a version is released only once.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # By hand, to release the version on main when no push raised it (the first run of the release job, or a release that failed).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The picture tests drive the runner's own Chrome.
      - run: npm test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - run: npm run build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@tinkerbench-studio'
      - name: The tag is the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A tag or release made with GITHUB_TOKEN starts no workflow, so the publish job above never sees the tag this job makes: this job publishes
  # itself. release-version decides, and answers no for a version that is already tagged, so a re-run or a second push releases nothing.
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    # One release at a time, each on the latest main.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@tinkerbench-studio'
      - id: version
        uses: tinkerbench-studio/github-actions/release-version@f7a5f9b1359632c12f915fe7cd49a5cb92ecd96f # github-actions#1
        with:
          files: package.json
          before: ${{ github.event.before }}
      - name: Tag and release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
      - run: npm ci
        if: steps.version.outputs.release == 'true'
      - name: Publish
        if: steps.version.outputs.release == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
