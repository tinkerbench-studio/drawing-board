# Tests every pull request. A pull request never changes the version: the version job fails one that does. After the merge to main, the
# release job raises the package's version and the plugin's (two separate versions), commits the raise to main, tags v<version>, cuts a GitHub
# release and publishes the package to GitHub Packages. The marketplace pins this repository by that tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The picture tests drive the runner's own Chrome.
      - run: npm test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - run: npm run build

  # A pull request that changes the version in either file fails; the release job raises it after the merge.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # version-check needs every copy it is given to agree, and the package and the plugin keep separate versions: one step each.
      - uses: tinkerbench-studio/github-actions/version-check@198e8610c3ff4fe57ca1b39696bc7106cea6e491 # v1.4.0
        with:
          copies: package.json
      - uses: tinkerbench-studio/github-actions/version-check@198e8610c3ff4fe57ca1b39696bc7106cea6e491 # v1.4.0
        with:
          copies: plugin/.claude-plugin/plugin.json

  # A tag or release made with GITHUB_TOKEN starts no workflow, so this job publishes itself. version-raise decides what is raised.
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    # One release at a time, each on the latest main, so two merges in a row get two versions.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@tinkerbench-studio'
      # The raise commit is pushed with GITHUB_TOKEN and starts no workflow, but skip it anyway if this job is ever run on it.
      - id: own
        run: git log -1 --format=%s "$GITHUB_SHA" | grep -q '^Raise the version to ' && echo skip=true >> "$GITHUB_OUTPUT" || true
      - id: package
        if: steps.own.outputs.skip != 'true'
        uses: tinkerbench-studio/github-actions/version-raise@198e8610c3ff4fe57ca1b39696bc7106cea6e491 # v1.4.0
        with:
          copies: package.json
          paths: |
            /src/**
            /package.json
            /package-lock.json
            /plugin/**
          before: ${{ github.event.before }}
          after: ${{ github.sha }}
          # Reads the merged pull request's labels: release:minor or release:major raises that part, and any other release: label fails the job.
          token: ${{ github.token }}
      - id: plugin
        if: steps.own.outputs.skip != 'true'
        uses: tinkerbench-studio/github-actions/version-raise@198e8610c3ff4fe57ca1b39696bc7106cea6e491 # v1.4.0
        with:
          copies: plugin/.claude-plugin/plugin.json
          paths: /plugin/**
          before: ${{ github.event.before }}
          after: ${{ github.sha }}
      # Both raises land in one commit.
      - name: Commit the raise
        if: steps.package.outputs.raised == 'true' || steps.plugin.outputs.raised == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PLUGIN_VERSION: ${{ steps.plugin.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Raise the version to ${PACKAGE_VERSION:-$PLUGIN_VERSION}"
          git push origin HEAD:main
      - name: Release
        if: steps.package.outputs.raised == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.package.outputs.version }}
        run: gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --generate-notes
      - run: npm ci
        if: steps.package.outputs.raised == 'true'
      - name: Publish
        if: steps.package.outputs.raised == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
